<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>足球場邊記錄器 v5.80</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050b12;color:#eef6ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    .boot{
      min-height:100svh;display:flex;align-items:center;justify-content:center;
      padding:24px;background:
      radial-gradient(circle at 50% 20%,rgba(34,197,94,.10),transparent 36%),
      linear-gradient(180deg,#06101a,#02070c);
    }
    .bootCard{
      width:min(92vw,460px);border:1px solid #24384d;border-radius:22px;
      background:#0d1927;padding:24px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.38)
    }
    .bootBall{font-size:42px;margin-bottom:8px}
    .bootTitle{font-size:22px;font-weight:900;letter-spacing:.02em}
    .bootSub{margin-top:8px;color:#9fb4c8;font-size:14px;line-height:1.6}
    .bootError{margin-top:14px;padding:12px;border-radius:14px;background:#2a1320;color:#ffb3bf;
      text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.55}
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="bootCard">
      <div class="bootBall">⚽</div>
      <div class="bootTitle">足球場邊記錄器 v5.80</div>
      <div class="bootSub">正在載入新版程式…</div>
      <div class="bootError" id="bootError" hidden></div>
    </div>
  </div>

<script>
(async function(){
  "use strict";

  const BASE_VERSION = "v5.79";
  const NEW_VERSION  = "v5.80";
  const SOURCES = [
    "https://raw.githubusercontent.com/bruce690813/football-marker/ff440dad7811b0c1b69a493ec0dff9c23ee012e6/index.html",
    "https://cdn.jsdelivr.net/gh/bruce690813/football-marker@ff440dad7811b0c1b69a493ec0dff9c23ee012e6/index.html"
  ];

  function showError(message){
    const box=document.getElementById("bootError");
    if(box){
      box.hidden=false;
      box.textContent="載入失敗：\\n"+message+
        "\\n\\n請確認網路連線後重新整理頁面。";
    }
  }

  async function fetchBase(){
    let lastError=null;
    for(const url of SOURCES){
      try{
        const response=await fetch(url,{cache:"no-store",credentials:"omit"});
        if(!response.ok) throw new Error("HTTP "+response.status);
        const text=await response.text();
        if(!text.includes("足球場邊記錄器") || !text.includes(BASE_VERSION)){
          throw new Error("基底版本不是 "+BASE_VERSION);
        }
        return text;
      }catch(err){
        lastError=err;
      }
    }
    throw lastError || new Error("無法取得 v5.79 基底程式");
  }

  function replaceOnce(html, regex, replacement, label){
    const before=html;
    html=html.replace(regex,replacement);
    if(html===before) throw new Error("找不到「"+label+"」區塊，為避免誤改已停止載入。");
    return html;
  }

  function applyV580Patch(html){
    // 1) 顯示版本
    html=html.split(BASE_VERSION).join(NEW_VERSION);

    // 2) 主畫面：移除重複的「儲存圖片」，只留摘要 / CSV；新比賽維持整排。
    html=replaceOnce(
      html,
      /<div class="toolGrid finalTools">\s*<button class="btn teal" onclick="openReport\(\)">📋 摘要<\/button>\s*<button class="btn blue" onclick="saveReportImage\(\)">🖼️ 儲存圖片<\/button>\s*<button class="btn gray" onclick="exportCSV\(\)">📄 匯出 CSV<\/button>\s*<button class="btn ghost danger newGameBtn" onclick="resetGame\(\)">＋ 新比賽<\/button>\s*<\/div>/,
      `<div class="toolGrid finalTools">
            <button class="btn teal" onclick="openReport()">📋 摘要</button>
            <button class="btn gray" onclick="exportCSV()">📄 匯出 CSV</button>
            <button class="btn ghost danger newGameBtn" onclick="resetGame()">＋ 新比賽</button>
          </div>`,
      "主畫面輸出工具"
    );

    // 3) 摘要：底部只保留唯一的「分享 / 儲存圖片」。
    html=replaceOnce(
      html,
      /<div class="reportActions twoReportActions">\s*<button id="reportCloseBottom" class="reportActionBtn reportCloseBtn reportActionClose" onclick="closeReport\(\)">關閉<\/button>\s*<button class="reportActionBtn reportShareBtn reportActionShare" onclick="shareReportImage\(\)">分享 \/ 儲存圖片<\/button>\s*<\/div>/,
      `<div class="reportActions oneReportAction">
      <button class="reportActionBtn reportShareBtn reportActionShare" onclick="shareReportImage()">分享 / 儲存圖片</button>
    </div>`,
      "摘要底部操作列"
    );

    // 4) 摘要：將關閉改為右上角 ×。
    // 沿用 reportCloseBottom id，讓既有焦點 / 無障礙 JS 不需要改動。
    html=replaceOnce(
      html,
      /(<div class="reportTop">\s*<div class="reportModalTitle">⚽ 比賽摘要｜本場事件統計<\/div>)/,
      `$1
        <button id="reportCloseBottom" class="reportCloseIcon" type="button"
          onclick="closeReport()" aria-label="關閉摘要" title="關閉">×</button>`,
      "摘要標題"
    );

    // 5) 快速指南同步新的操作流程。
    html=html.replace(
      "確認本場事件統計與事件紀錄，再開啟摘要、儲存圖片或匯出 CSV。",
      "確認本場事件統計與事件紀錄，再開啟摘要進行分享 / 儲存圖片，或匯出 CSV。"
    );

    // 6) 最後載入的 CSS，覆蓋舊版三欄工具列 / 雙按鈕摘要樣式。
    const patchCss = `
<style id="v580UxPatch">
  /* v5.80：主畫面只留「摘要 / 匯出 CSV」 */
  .toolGrid.finalTools{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }
  .toolGrid.finalTools .newGameBtn{
    grid-column:1 / -1 !important;
  }

  /* v5.80：摘要右上角關閉 */
  #reportModal .reportTop{
    position:sticky !important;
    padding-right:62px !important;
  }
  #reportModal .reportCloseIcon{
    position:absolute;
    top:50%;
    right:12px;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    min-width:38px;
    min-height:38px;
    padding:0;
    border:1px solid #33485f;
    border-radius:12px;
    background:#15263a;
    color:#e8f2ff;
    box-shadow:0 3px 12px rgba(0,0,0,.24);
    display:flex;
    align-items:center;
    justify-content:center;
    font:800 28px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #reportModal .reportCloseIcon:active{
    transform:translateY(-50%) scale(.96);
    background:#1b3048;
  }
  #reportModal .reportCloseIcon:focus-visible{
    outline:2px solid #60c7ff;
    outline-offset:2px;
  }

  /* v5.80：摘要底部只有一個主要輸出 CTA */
  #reportModal .reportActions.oneReportAction{
    grid-template-columns:1fr !important;
  }
  #reportModal .reportActions.oneReportAction .reportActionShare{
    width:100%;
  }

  @media(max-width:430px){
    #reportModal .reportTop{
      padding-right:56px !important;
    }
    #reportModal .reportCloseIcon{
      right:10px;
      width:36px;
      height:36px;
      min-width:36px;
      min-height:36px;
      border-radius:11px;
      font-size:26px;
    }
  }
</style>`;

    if(!html.includes("</head>")) throw new Error("HTML 缺少 </head>");
    html=html.replace("</head>",patchCss+"\\n</head>");

    // 留下版本標記，方便之後確認實際載入的是哪一版。
    html=html.replace(
      "</body>",
      `<!-- football-marker ${NEW_VERSION}: output UX consolidation patch -->\\n</body>`
    );

    return html;
  }

  try{
    const baseHtml=await fetchBase();
    const patchedHtml=applyV580Patch(baseHtml);

    // 以同一個 document 載入完整 App，localStorage origin 不變。
    document.open();
    document.write(patchedHtml);
    document.close();
  }catch(err){
    console.error(err);
    showError(err && err.message ? err.message : String(err));
  }
})();
</script>
</body>
</html>
