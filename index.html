<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>足球精彩標記器</title>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--muted:#8b949e;
  --green:#238636;--blue:#1f6feb;--gold:#d29922;--purple:#8957e5;--red:#b33a3a;--gray:#30363d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{min-height:100dvh}
.wrap{max-width:720px;margin:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
h1{font-size:21px;margin:0}
.sub{font-size:11px;color:var(--muted);margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px;margin-bottom:8px}
.metaGrid{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
.metaGrid input{grid-column:1/2}
input{width:100%;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0d1117;color:#fff}
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:43px;font-weight:800;line-height:1;margin:9px 0}
.mainControls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:11px 8px;font-size:16px;font-weight:750;color:#fff;cursor:pointer}
.start{background:var(--green)}.finish{background:var(--red)}.new{background:var(--gray)}
.events{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.event{min-height:76px;font-size:18px}
.goal{background:var(--green)}.save{background:var(--blue)}.shot{background:var(--gold)}.play{background:var(--purple)}
.event small{display:block;font-size:11px;font-weight:500;opacity:.9;margin-top:3px}
.status{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.secondary{background:var(--gray);font-size:13px;padding:9px 6px}
.export{background:#f0f6fc;color:#111}
.share{background:#2f81f7}
.logwrap{display:none;margin-top:8px}
.logwrap.open{display:block}
.log{max-height:150px;overflow:auto}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.time{color:#f2cc60;font-variant-numeric:tabular-nums}.del{background:transparent;color:#ff7b72;padding:3px 5px;font-size:13px}
.finished{color:#ff9b9b;font-weight:700}
@media(max-height:760px){
  h1{font-size:19px}.timer{font-size:39px}
  .event{min-height:68px}.card{padding:8px;margin-bottom:6px}
  button{padding:9px 7px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>⚽ 足球精彩標記器</h1>
    <div class="sub">手機現場版</div>
  </div>

  <div class="card">
    <div class="metaGrid">
      <input id="matchName" placeholder="比賽名稱，例如：忠義 vs A隊">
      <button class="new" onclick="newMatch()">新比賽</button>
      <input id="venue" placeholder="比賽場地，例如：百齡足球場">
    </div>

    <div class="timer" id="timer">00:00.00</div>

    <div class="mainControls">
      <button class="start" onclick="startMatch()">▶ 開始比賽</button>
      <button class="finish" onclick="finishMatch()">■ 比賽結束</button>
    </div>

    <div class="status" id="status">尚未開始</div>
  </div>

  <div class="card">
    <div class="events">
      <button class="event goal" onclick="mark('GOAL')">⚽ GOAL<small>進球</small></button>
      <button class="event save" onclick="mark('SAVE')">🧤 SAVE<small>撲救</small></button>
      <button class="event shot" onclick="mark('SHOT')">🎯 SHOT<small>射門</small></button>
      <button class="event play" onclick="mark('GREAT_PLAY')">🔥 GREAT PLAY<small>精彩配合</small></button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <button class="secondary" onclick="undoLast()">↶ 復原</button>
      <button class="secondary" onclick="toggleLog()">☰ 紀錄 <span id="count">0</span></button>
      <button class="secondary" onclick="saveNow()">💾 儲存</button>
    </div>
    <div class="logwrap" id="logwrap">
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <button class="share" onclick="shareCSV()">分享 CSV</button>
      <button class="export" onclick="downloadCSV()">下載 CSV</button>
      <button class="secondary" onclick="downloadJSON()">JSON 備份</button>
    </div>
    <div class="status">比賽結束後建議立即分享或下載 CSV</div>
  </div>
</div>

<script>
const KEY='football_marker_v25';

let state={
  matchName:'',
  venue:'',
  started:false,
  finished:false,
  startEpoch:null,
  finalElapsed:0,
  markers:[]
};

function save(){
  state.matchName=document.getElementById('matchName').value.trim();
  state.venue=document.getElementById('venue').value.trim();
  localStorage.setItem(KEY,JSON.stringify(state));
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) state={...state,...JSON.parse(raw)};
  }catch(e){}
  document.getElementById('matchName').value=state.matchName||'';
  document.getElementById('venue').value=state.venue||'';
  render();
}

function elapsed(){
  if(state.started && !state.finished && state.startEpoch){
    return (Date.now()-state.startEpoch)/1000;
  }
  return state.finalElapsed||0;
}

function fmt(sec){
  sec=Math.max(0,Number(sec)||0);
  const m=Math.floor(sec/60),s=sec-m*60;
  return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0');
}

function tick(){
  document.getElementById('timer').textContent=fmt(elapsed());
  requestAnimationFrame(tick);
}

function startMatch(){
  if(state.started && !state.finished)return;
  if(state.finished){
    alert('本場比賽已結束，請先按「新比賽」');
    return;
  }
  state.started=true;
  state.startEpoch=Date.now();
  state.finalElapsed=0;
  save();
  render();
}

function finishMatch(){
  if(!state.started || state.finished){
    if(!state.started) alert('比賽尚未開始');
    return;
  }
  if(!confirm('確定本場比賽已結束嗎？'))return;
  state.finalElapsed=elapsed();
  state.finished=true;
  save();
  render();
}

function newMatch(){
  if((state.started || state.markers.length) && !confirm('建立新比賽會清空目前計時與標記，確定嗎？'))return;
  state={matchName:'',venue:'',started:false,finished:false,startEpoch:null,finalElapsed:0,markers:[]};
  document.getElementById('matchName').value='';
  document.getElementById('venue').value='';
  save();
  render();
}

function mark(event){
  if(!state.started){alert('請先按「開始比賽」');return}
  if(state.finished){alert('本場比賽已結束');return}
  const sec=elapsed();
  state.markers.push({
    event,
    seconds:sec,
    time:fmt(sec),
    recorded_at:new Date().toISOString()
  });
  save();
  render();
  if(navigator.vibrate)navigator.vibrate(35);
}

function undoLast(){
  if(!state.markers.length)return;
  state.markers.pop();
  save();
  render();
}

function deleteMarker(i){
  state.markers.splice(i,1);
  save();
  render();
}

function render(){
  document.getElementById('count').textContent=state.markers.length;
  let text='尚未開始',cls='';
  if(state.started&&!state.finished)text='比賽進行中';
  if(state.finished){text='比賽已結束｜'+fmt(state.finalElapsed);cls='finished'}
  const st=document.getElementById('status');
  st.textContent=text;
  st.className='status '+cls;

  const log=document.getElementById('log');
  log.innerHTML='';
  state.markers.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<div><b>${emoji(m.event)} ${m.event}</b></div><div class="time">${fmt(m.seconds)}</div><button class="del" onclick="deleteMarker(${i})">✕</button>`;
    log.appendChild(d);
  });
}

function toggleLog(){
  document.getElementById('logwrap').classList.toggle('open');
}

function emoji(e){
  return {GOAL:'⚽',SAVE:'🧤',SHOT:'🎯',GREAT_PLAY:'🔥'}[e]||'•';
}

function csvEscape(v){
  const s=String(v??'');
  return /[",\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s;
}

function csvText(){
  save();
  const rows=[['match_name','venue','time','seconds','event','note','recorded_at']];
  state.markers.forEach(m=>{
    rows.push([
      state.matchName,
      state.venue,
      fmt(m.seconds),
      m.seconds.toFixed(3),
      m.event,
      '',
      m.recorded_at
    ]);
  });
  return '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

function safeName(){
  return (state.matchName||'match').replace(/[\\/:*?"<>|]/g,'_');
}

function dateStamp(){
  const d=new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function csvFilename(){
  return `${dateStamp()}_${safeName()}_markers.csv`;
}

function downloadBlob(content,type,name){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function downloadCSV(){
  downloadBlob(csvText(),'text/csv;charset=utf-8',csvFilename());
}

function downloadJSON(){
  save();
  downloadBlob(
    JSON.stringify(state,null,2),
    'application/json',
    `${dateStamp()}_${safeName()}_backup.json`
  );
}

async function shareCSV(){
  const file=new File([csvText()],csvFilename(),{type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        title:'足球精彩標記 CSV',
        text:`${state.matchName||'足球比賽'}｜${state.venue||'未填場地'}`,
        files:[file]
      });
      return;
    }catch(e){
      if(e.name==='AbortError')return;
    }
  }
  alert('這個瀏覽器目前無法直接分享檔案，將改為下載 CSV。');
  downloadCSV();
}

function saveNow(){
  save();
  alert('已儲存在手機瀏覽器');
}

document.getElementById('matchName').addEventListener('change',save);
document.getElementById('venue').addEventListener('change',save);

load();
tick();
</script>
</body>
</html>
