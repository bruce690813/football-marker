<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>足球場邊記錄器 v5.80</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050b12;color:#eef6ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    .boot{
      min-height:100svh;display:flex;align-items:center;justify-content:center;
      padding:24px;background:
      radial-gradient(circle at 50% 20%,rgba(34,197,94,.10),transparent 36%),
      linear-gradient(180deg,#06101a,#02070c);
    }
    .bootCard{
      width:min(92vw,460px);border:1px solid #24384d;border-radius:22px;
      background:#0d1927;padding:24px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.38)
    }
    .bootBall{font-size:42px;margin-bottom:8px}
    .bootTitle{font-size:22px;font-weight:900;letter-spacing:.02em}
    .bootSub{margin-top:8px;color:#9fb4c8;font-size:14px;line-height:1.6}
    .bootError{margin-top:14px;padding:12px;border-radius:14px;background:#2a1320;color:#ffb3bf;
      text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.55}
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="bootCard">
      <div class="bootBall">⚽</div>
      <div class="bootTitle">足球場邊記錄器 v5.80</div>
      <div class="bootSub">正在載入新版程式…</div>
      <div class="bootError" id="bootError" hidden></div>
    </div>
  </div>

<script>
(async function(){
  "use strict";

  const BASE_VERSION = "v5.79";
  const NEW_VERSION  = "v5.80";
  const SOURCES = [
    "https://raw.githubusercontent.com/bruce690813/football-marker/ff440dad7811b0c1b69a493ec0dff9c23ee012e6/index.html",
    "https://cdn.jsdelivr.net/gh/bruce690813/football-marker@ff440dad7811b0c1b69a493ec0dff9c23ee012e6/index.html"
  ];

  function showError(message){
    const box=document.getElementById("bootError");
    if(box){
      box.hidden=false;
      box.textContent="載入失敗：\n"+message+
        "\n\n請確認網路連線後重新整理頁面。";
    }
  }

  async function fetchBase(){
    let lastError=null;
    for(const url of SOURCES){
      try{
        const response=await fetch(url,{cache:"no-store",credentials:"omit"});
        if(!response.ok) throw new Error("HTTP "+response.status);
        const text=await response.text();
        if(!text.includes("足球場邊記錄器") || !text.includes(BASE_VERSION)){
          throw new Error("基底版本不是 "+BASE_VERSION);
        }
        return text;
      }catch(err){
        lastError=err;
      }
    }
    throw lastError || new Error("無法取得 v5.79 基底程式");
  }

  function requireMarker(html, marker, label){
    if(!html.includes(marker)){
      throw new Error("找不到「"+label+"」；為避免誤改已停止載入。");
    }
  }

  function applyV580Patch(html){
    /*
      v5.80 修正版：
      不再用舊版脆弱的整段 HTML Regex 去尋找按鈕。
      先確認 v5.79 真實存在的元素 ID，再於 DOMContentLoaded 後移動 / 移除元素。
      如此不受 class、空白或按鈕屬性微調影響。
    */
    requireMarker(html, 'id="saveImageBtn"', "主畫面儲存圖片按鈕");
    requireMarker(html, 'id="reportCloseBtn"', "摘要關閉按鈕");
    requireMarker(html, 'id="reportShareBtn"', "摘要分享按鈕");
    requireMarker(html, 'class="toolGrid finalTools"', "主畫面輸出工具");
    requireMarker(html, 'class="reportActions twoReportActions"', "摘要底部操作列");

    html=html.split(BASE_VERSION).join(NEW_VERSION);

    const patchCss = `
<style id="v580UxPatch">
  /* 主畫面：摘要 / CSV 兩欄，新比賽仍維持原本獨立整排 */
  .toolGrid.finalTools{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }

  /* 摘要：右上角 × */
  #reportModal .reportTop{
    position:relative!important;
  }
  #reportModal .reportTitle{
    padding-right:48px!important;
  }
  #reportModal .reportCloseIcon{
    position:absolute!important;
    top:10px!important;
    right:10px!important;
    width:38px!important;
    height:38px!important;
    min-width:38px!important;
    min-height:38px!important;
    margin:0!important;
    padding:0!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    border:1px solid #33485f!important;
    border-radius:12px!important;
    background:#15263a!important;
    color:#eef6ff!important;
    box-shadow:0 3px 12px rgba(0,0,0,.24)!important;
    font:800 28px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
    cursor:pointer!important;
    z-index:6!important;
    touch-action:manipulation!important;
    -webkit-tap-highlight-color:transparent!important;
  }
  #reportModal .reportCloseIcon:active{
    transform:scale(.96)!important;
    background:#1b3048!important;
  }
  #reportModal .reportCloseIcon:focus-visible{
    outline:2px solid #60c7ff!important;
    outline-offset:2px!important;
  }

  /* 摘要底部只保留唯一圖片輸出 CTA */
  #reportModal .reportActions.oneReportAction{
    grid-template-columns:1fr!important;
  }
  #reportModal .reportActions.oneReportAction #reportShareBtn{
    width:100%!important;
  }

  @media(max-width:430px){
    #reportModal .reportTitle{padding-right:44px!important}
    #reportModal .reportCloseIcon{
      top:9px!important;
      right:9px!important;
      width:36px!important;
      height:36px!important;
      min-width:36px!important;
      min-height:36px!important;
      font-size:26px!important;
      border-radius:11px!important;
    }
  }
</style>`;

    const patchJs = `
<script id="v580UxPatchScript">
(function(){
  function applyV580DomPatch(){
    // 1. 主畫面移除重複的「儲存圖片」
    const saveImageBtn=document.getElementById('saveImageBtn');
    if(saveImageBtn) saveImageBtn.remove();

    // 2. 摘要關閉按鈕移到右上角，沿用原 ID，因此既有 click 綁定不會失效
    const reportCloseBtn=document.getElementById('reportCloseBtn');
    const reportTop=document.querySelector('#reportModal .reportTop');
    if(reportCloseBtn && reportTop){
      reportCloseBtn.className='reportCloseIcon';
      reportCloseBtn.textContent='×';
      reportCloseBtn.setAttribute('aria-label','關閉摘要');
      reportCloseBtn.setAttribute('title','關閉');
      reportTop.appendChild(reportCloseBtn);
    }

    // 3. 摘要底部只保留「分享／儲存圖片」
    const reportActions=document.querySelector('#reportModal .reportActions');
    if(reportActions){
      reportActions.classList.remove('twoReportActions');
      reportActions.classList.add('oneReportAction');
    }

    // 4. 快速指南同步新的資訊架構
    document.querySelectorAll('.quickGuideStepText span').forEach(function(span){
      if(span.textContent.includes('再開啟摘要、儲存圖片或匯出 CSV')){
        span.textContent='確認本場事件統計與事件紀錄，再開啟摘要進行分享／儲存圖片，或匯出 CSV。';
      }
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',applyV580DomPatch,{once:true});
  }else{
    applyV580DomPatch();
  }
})();
<\/script>`;

    if(!html.includes("</head>")) throw new Error("基底 HTML 缺少 </head>");
    if(!html.includes("</body>")) throw new Error("基底 HTML 缺少 </body>");

    html=html.replace("</head>",patchCss+"\n</head>");
    html=html.replace("</body>",patchJs+"\n<!-- football-marker v5.80 corrected patch -->\n</body>");
    return html;
  }

  try{
    const baseHtml=await fetchBase();
    const patchedHtml=applyV580Patch(baseHtml);

    document.open();
    document.write(patchedHtml);
    document.close();
  }catch(err){
    console.error(err);
    showError(err && err.message ? err.message : String(err));
  }
})();
</script>
</body>
</html>
