/* =========================================================
   v6.52 / Visual Quiet — shared across PRE/FIRST/HALF/SECOND/EXTRA/FINISHED
   以群組底色、留白與細分隔線代替重複的巢狀框線。
   ========================================================= */
:root{
 --line:#2c455c;
 --subtle-line:rgba(126,163,188,.15);
 --control-line:rgba(141,181,209,.20);
 --surface:#13283b;
 --surface-muted:#182d40;
}
/* 一級區塊保留柔和輪廓；主內容之間用留白分組。 */
.card{background:linear-gradient(155deg,rgba(25,46,65,.96),rgba(16,34,50,.97));
 border:1px solid rgba(105,144,173,.21);
 box-shadow:0 3px 14px rgba(2,13,23,.10);border-radius:18px}
#metaCard{border-color:rgba(96,151,140,.22)}
/* 賽事與場地共享唯一容器，移除兩條獨立膠囊框。 */
.matchMeta{display:flex;flex-direction:column;gap:0;border-radius:12px;
 overflow:hidden;border:1px solid rgba(95,142,165,.22);background:#102437}
.matchMeta .metaRow{flex-shrink:0;height:var(--meta-height);padding:0 11px;
 background:transparent;border:0;border-radius:0;gap:7px}
.matchMeta .metaRow+.metaRow{border-top:1px solid var(--subtle-line)}
.matchMeta .metaRow:focus-within{background:#183749;outline:1px solid rgba(146,230,194,.35);outline-offset:-1px}
.metaName{color:#f4f8fd}.metaExtra{color:#9fb7c9;max-width:58%;overflow:hidden;text-overflow:ellipsis}
/* 保留資訊欄高度，名單／守門員淡化為輔助文字，不新增外框。 */
#metaCard>.row .hint{font-size:12px;color:#bfd0db}
/* LIVE、比分的注意力落在文字與黃色數字，而非三層邊線。 */
#liveCard{border-color:rgba(97,145,164,.20)}
#liveCard .timeLine{padding:2px 0 6px;border-bottom:1px solid var(--subtle-line)}
#liveCard .phase{display:inline-flex;align-items:center;gap:6px;
 background:rgba(24,105,93,.29);border:none;border-radius:999px;
 color:#c1f4e3;padding:5px 10px;font-weight:800;letter-spacing:.3px}
body[data-phase="FIRST"] #phaseView::before,
body[data-phase="SECOND"] #phaseView::before,
body[data-phase="EXTRA"] #phaseView::before{content:"";width:7px;height:7px;
 background:#fa525d;border-radius:50%;box-shadow:0 0 0 3px rgba(250,82,93,.14)}
body[data-phase="HALF"] #phaseView{background:rgba(233,176,64,.14);color:#ffe19c}
body[data-phase="FINISHED"] #phaseView{background:rgba(151,173,194,.12);color:#c7d4df}
body[data-phase="PRE"] #phaseView{background:rgba(151,173,194,.12);color:#c7d4df}
body[data-phase="EXTRA"] #phaseView{background:rgba(105,77,159,.28);color:#e1d0ff}
#clock{font-variant-numeric:tabular-nums}
.scoreboard{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px}
.scoreTeam{font-size:clamp(13px,3.9vw,19px);color:#e7f0fa;line-height:1.3}
.scoreNumber{display:flex;align-items:center;gap:5px;text-shadow:none;font-size:36px;letter-spacing:0}
.scoreDigit{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;
 border:1px solid rgba(98,153,190,.40);border-radius:12px;
 padding:2px 9px 3px;min-width:48px;min-height:60px;
 background:linear-gradient(#10273c 0 49%,#0c2033 50% 100%);
 color:#ffe374;font-weight:950;font-variant-numeric:tabular-nums}
.scoreDigit:after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1px;background:rgba(181,212,235,.15);pointer-events:none}
.scoreColon{font-size:26px;color:#8597ab;line-height:1}
/* 控制區不再每一顆都畫醒目的邊線；危險動作仍保留低彩度提示。 */
.controls{margin-top:10px}
.controls button{border-color:transparent;background:#26435a;border-radius:12px}
.controls .btnPrimary{background:#f36e69;color:#141e2b}
.controls #endBtn{background:rgba(173,69,81,.15);color:#ffadba;border:1px solid rgba(220,108,125,.32)}
.controls #phaseBtn{background:#264e59;border:1px solid rgba(86,166,169,.18)}
body[data-phase="SECOND"] .controls #phaseBtn,body[data-phase="EXTRA"] .controls #phaseBtn{background:#264155}
/* 事件按鈕：以實色塊標記四大操作，黃／紅牌等維持次級對比。 */
#eventsCard{border-color:rgba(103,150,178,.20)}
.eventGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.eventBtn{min-height:62px;grid-template-columns:auto auto;display:flex;flex-direction:row;
 justify-content:center;gap:9px;font-size:16px;font-weight:900;line-height:1.2;
 border:1px solid transparent;border-radius:13px;padding:8px 6px;
 transition:filter .15s,transform .08s;background:#213c52}
.eventBtn:active{filter:brightness(1.14);transform:scale(.985)}
.eventBtn span:first-child{font-size:22px;line-height:1}
.eventBtn[data-event="GOAL"]{background:#24813e;border-color:transparent}
.eventBtn[data-event="SAVE"]{background:#286cce;border-color:transparent}
.eventBtn[data-event="SHOT"]{background:#c89628;border-color:transparent}
.eventBtn[data-event="DEFENSE"]{background:#8348c9;border-color:transparent}
.eventBtn[data-event="YELLOW"],.eventBtn[data-event="RED"]{background:#1b354a;border:1px solid rgba(116,157,180,.22)}
.eventBtn[data-event="YELLOW"] span:first-child,.eventBtn[data-event="RED"] span:first-child{filter:saturate(1.1)}
.eventBtn[id="manualScoreBtn"],.eventBtn[id="rosterBtn"]{background:#173045;color:#dce8f1;
 border:1px solid rgba(116,157,180,.15);font-weight:750}
/* 統計與事件只使用輕柔底色和事件左側指示，不再層層描框。 */
.stat{background:#1a3449;border-radius:11px}
.logItem{background:#1b354a;border-radius:10px;border-top:0;border-right:0;border-bottom:0}
.logItem button{background:#203d52;border:1px solid rgba(138,172,196,.20)}
/* 底列用薄分界而非粗框；維持可觸控尺寸與 safe area。 */
.toolbar{background:rgba(14,30,46,.975);border-top:1px solid rgba(107,150,178,.28);
 box-shadow:0 -6px 22px rgba(4,14,27,.18)}
.toolbar button{background:#21394e;border:1px solid rgba(125,167,194,.18);border-radius:12px}
/* iPhone Safari：主內容獨立捲動，工具列保留自身空間，不覆蓋任何事件按鈕。
   視窗縮小時可往上滑查看未顯示的按鈕，避免出現按鈕被工具列壓住。 */
html,body{height:100%;height:100dvh;overflow:hidden}
.app{height:calc(100vh - var(--toolbar) - env(safe-area-inset-bottom));
 height:calc(100dvh - var(--toolbar) - env(safe-area-inset-bottom));
 overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
 padding-bottom:28px;scrollbar-width:thin;scrollbar-color:#37546b transparent}
.toolbar{height:calc(var(--toolbar) + env(safe-area-inset-bottom))}
@media(max-width:380px){.scoreDigit{min-width:42px;min-height:54px;padding:2px 7px}.scoreNumber{font-size:33px;gap:3px}
 .eventBtn{font-size:15px;gap:6px}.metaExtra{font-size:10.5px}}
/* compact / ultra 都適用，避免只修上半場而忘記下半場與延長賽。 */
body.compact .eventBtn{min-height:60px}
body.ultra .eventBtn{min-height:56px}
body.ultra .scoreDigit{min-height:54px}
body.ultra .scoreNumber{font-size:32px}
@media(prefers-reduced-motion:reduce){.eventBtn{transition:none}}

</style>
</head>

const defaultData=()=>({schema:1,version:VERSION,matchId:'m'+Date.now(),matchName:'',stage:'',round:'',venue:'',ourTeam:'忠義',oppTeam:'對手',regulation:20,roster:[],keeper:'',scores:{OUR:0,OPP:0},phase:'PRE',elapsedBase:0,runningSince:null,startAt:null,endAt:null,events:[],layout:'compact'});
let s=defaultData(),modalClose=null,toastTimer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(v,max=80)=>String(v??'').replace(/[<>\r\n\t]/g,'').trim().slice(0,max);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number.isFinite(+v)?Math.floor(+v):a));
const fmt=t=>{const z=Math.max(0,Math.floor(t));return `${String(Math.floor(z/60)).padStart(2,'0')}:${String(z%60).padStart(2,'0')}`};
const when=x=>x?new Date(x).toLocaleString('zh-TW',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const now=()=>Date.now(),elapsed=()=>Math.max(0,s.elapsedBase+(s.runningSince?Math.floor((now()-s.runningSince)/1000):0));

const load=()=>{try{const raw=localStorage.getItem(KEY);if(raw){const obj=JSON.parse(raw);if(obj&&Array.isArray(obj.events)&&obj.scores){s={...defaultData(),...obj};if(!['normal','compact','ultra'].includes(s.layout))s.layout='compact'}}}catch(e){console.warn('載入失敗',e)}};
const toast=t=>{clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)};
function saveAndRender(){persist();render()}
function setRunning(on){if(on){if(!s.runningSince)s.runningSince=now();if(!s.startAt)s.startAt=now()}else if(s.runningSince){s.elapsedBase=elapsed();s.runningSince=null}}
function phaseName(){return {PRE:'尚未開始',FIRST:'比賽中',HALF:'中場休息',SECOND:'下半場',EXTRA:'延長賽',FINISHED:'比賽結束'}[s.phase]||s.phase}
function buttonsState(){const p=s.phase;$('startBtn').classList.toggle('hide',p!=='PRE');$('phaseBtn').classList.toggle('hide',p==='PRE'||p==='FINISHED');$('endBtn').classList.toggle('hide',p==='PRE'||p==='FINISHED');$('phaseBtn').textContent=p==='FIRST'?'⏸ 中場休息':p==='HALF'?'▶ 開始下半場':p==='SECOND'?'⏱ 進入延長賽':'⏸ 暫停／繼續';$('eventStatus').textContent=p==='PRE'?'可先填資料，再開始比賽':p==='FINISHED'?'賽事已結束':'點選事件後選擇球員'}
function render(){document.body.classList.remove('normal','compact','ultra');document.body.classList.add(s.layout);document.body.dataset.phase=s.phase;document.body.dataset.running=s.runningSince?'yes':'no';

function logHTML(e){return `<div class="logItem ${e.type==='GOAL'?'goal':e.type==='YELLOW'?'yellow':e.type==='RED'?'red':''}"><div><div class="logTop"><span class="logTime">${fmt(e.second)}</span><span class="logTeam">${teamLabels[e.team]||'我方'}</span><span class="logNo">${e.number?'#'+esc(e.number):'未指定背號'}</span></div><div class="logBottom"><b>${eventLabels[e.type]||esc(e.type)}</b>${e.assist?'・助攻 #'+esc(e.assist):''}${e.score?'・'+esc(e.score):''}</div></div><button type="button" data-edit="${esc(e.id)}" aria-label="管理事件">•••</button></div>`}
const modal=(title,html,actions=[])=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalFooter').innerHTML='';actions.forEach(a=>{const b=document.createElement('button');b.textContent=a.label;if(a.primary)b.className='btnPrimary';b.addEventListener('click',a.fn);$('modalFooter').append(b)});$('shade').classList.add('open');$('modalBody').scrollTop=0};const close=()=>{$('shade').classList.remove('open')};$('closeModal').onclick=close;$('shade').addEventListener('click',e=>{if(e.target===$('shade'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function field(id,label,value='',max=60){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" maxlength="${max}" value="${esc(value)}" /></div>`}
function openMeta(){modal('🏆 編輯比賽資訊',`${field('mName','比賽賽事（例如：黃蜂盃）',s.matchName)}<div class="phaseInputs">${field('mStage','階段（例如：小組賽）',s.stage,24)}${field('mRound','場次（例如：第二十三場）',s.round,24)}</div>${field('mVenue','比賽場地',s.venue)}<div class="twocol">${field('mOur','我方球隊',s.ourTeam,35)}${field('mOpp','對方球隊',s.oppTeam,35)}</div><div class="field"><label for="mDuration">規定時間（分鐘，1～90）</label><input id="mDuration" type="number" min="1" max="90" value="${s.regulation}"></div>`,[{label:'取消',fn:close},{label:'儲存',primary:true,fn:()=>{s.matchName=clean($('mName').value,60);s.stage=clean($('mStage').value,24);s.round=clean($('mRound').value,24);s.venue=clean($('mVenue').value,60);s.ourTeam=clean($('mOur').value,35);s.oppTeam=clean($('mOpp').value,35);s.regulation=clamp($('mDuration').value,1,90);saveAndRender();close();toast('已更新賽事資料')}}])}
function openRoster(){modal('👕 球員名單／守門員',`<p class="modalText">輸入球員背號，以半形逗號分隔；支援 1～99 號。</p>${field('mRoster','本場名單',s.roster.join(', '),300)}${field('mKeeper','🧤 守門員背號（可空白）',s.keeper,2)}<p class="small">設定名單後，標記事件時可快速選擇背號。</p>`,[{label:'取消',fn:close},{label:'儲存名單',primary:true,fn:()=>{s.roster=[...new Set($('mRoster').value.split(/[,，\s]+/).map(v=>v.trim()).filter(v=>/^\d{1,2}$/.test(v)&&+v>=1&&+v<=99).map(v=>String(+v)))].slice(0,99).sort((a,b)=>+a-+b);const n=clean($('mKeeper').value,2);s.keeper=/^\d{1,2}$/.test(n)&&+n>=1&&+n<=99?String(+n):'';if(s.keeper&&!s.roster.includes(s.keeper))s.roster.push(s.keeper);saveAndRender();close();toast('名單已儲存')}}])}
function eventForm(type,existing=null){const editing=!!existing;const e=existing||{type,team:'OUR',number:'',assist:'',second:elapsed()};const rosterBtns=s.roster.length?`<div class="pickList" id="quickNums">${s.roster.map(n=>`<button type="button" data-num="${esc(n)}" class="${n===e.number?'active':''}">${esc(n)}</button>`).join('')}</div>`:'';
modal(editing?'✏️ 編輯事件':eventLabels[type],`<div class="field"><label for="eventType">事件類型</label><select id="eventType">${Object.keys(eventLabels).map(k=>`<option value="${k}" ${e.type===k?'selected':''}>${eventLabels[k]}</option>`).join('')}</select></div><div class="field"><label for="eventTeam">事件球隊</label><select id="eventTeam"><option value="OUR" ${e.team==='OUR'?'selected':''}>我方（${esc(s.ourTeam||'我方')}）</option><option value="OPP" ${e.team==='OPP'?'selected':''}>對手（${esc(s.oppTeam||'對手')}）</option></select></div><div class="twocol">${field('eventNum','球員背號（選填）',e.number,2)}<div class="field"><label for="eventSecond">事件時間（秒）</label><input id="eventSecond" type="number" min="0" max="999999" value="${e.second}"></div></div>${rosterBtns}${field('eventAssist','助攻背號（僅進球適用）',e.assist||'',2)}`,editing?[{label:'刪除',fn:()=>{if(confirm('確認刪除這筆事件？')){removeEvent(existing.id);close()}}},{label:'取消',fn:close},{label:'儲存修改',primary:true,fn:submit}]:[{label:'取消',fn:close},{label:'記錄事件',primary:true,fn:submit}]);
$('eventAssist').closest('.field').classList.toggle('hide',e.type!=='GOAL');$('eventType').onchange=()=>$('eventAssist').closest('.field').classList.toggle('hide',$('eventType').value!=='GOAL');$('quickNums')?.addEventListener('click',ev=>{const b=ev.target.closest('[data-num]');if(!b)return;$('eventNum').value=b.dataset.num;[...$('quickNums').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b))});
function submit(){const t=$('eventType').value,team=$('eventTeam').value,n=clean($('eventNum').value,2),a=clean($('eventAssist').value,2);if(n&&!validNum(n)||a&&!validNum(a)){toast('背號請輸入 1～99');return}const second=clamp($('eventSecond').value,0,999999);const record={id:existing?.id||'e'+now()+Math.random().toString(36).slice(2,7),type:t,team,number:n?String(+n):'',assist:t==='GOAL'&&a?String(+a):'',second,recordedAt:existing?.recordedAt||now()};if(editing){const i=s.events.findIndex(x=>x.id===existing.id);if(i<0)return;s.events[i]=record}else s.events.push(record);recalculateScores();saveAndRender();close();toast(editing?'事件已修改':'精彩事件已記錄')}}
const validNum=n=>/^\d{1,2}$/.test(n)&&+n>0&&+n<=99;
function recalculateScores(){/* Scores consist of recorded goals plus manual offset, retained for edit/delete consistency. */const cnt=t=>s.events.filter(e=>e.type==='GOAL'&&e.team===t).length;s.manualOffsets=s.manualOffsets||{OUR:0,OPP:0};s.scores.OUR=clamp(cnt('OUR')+s.manualOffsets.OUR,0,99);s.scores.OPP=clamp(cnt('OPP')+s.manualOffsets.OPP,0,99);let a=0,b=0;s.events.forEach(e=>{if(e.type==='GOAL')e.team==='OUR'?a++:b++;e.score=`${clamp(a+s.manualOffsets.OUR,0,99)} : ${clamp(b+s.manualOffsets.OPP,0,99)}`})}
function removeEvent(id){s.events=s.events.filter(e=>e.id!==id);recalculateScores();saveAndRender();toast('事件已刪除')}
function openLog(){modal(`☰ 全部事件（${s.events.length} 筆）`,s.events.length?`<div class="log">${[...s.events].reverse().map(logHTML).join('')}</div>`:'<div class="empty">尚未記錄事件</div>',[{label:'關閉',fn:close}])}
function openScore(){modal('🔢 手動調整比分',`<p class="modalText">比分以進球事件為基礎，手動差額會保留。調整後不會新增進球事件。</p><div class="twocol"><div class="field"><label for="scoreOur">我方比分</label><input type="number" min="0" max="99" id="scoreOur" value="${s.scores.OUR}"></div><div class="field"><label for="scoreOpp">對手比分</label><input type="number" min="0" max="99" id="scoreOpp" value="${s.scores.OPP}"></div></div>`,[{label:'取消',fn:close},{label:'套用比分',primary:true,fn:()=>{const ga=s.events.filter(e=>e.type==='GOAL'&&e.team==='OUR').length,gb=s.events.filter(e=>e.type==='GOAL'&&e.team==='OPP').length;s.manualOffsets={OUR:clamp($('scoreOur').value,0,99)-ga,OPP:clamp($('scoreOpp').value,0,99)-gb};recalculateScores();saveAndRender();close()}}])}
function startMatch(){s.phase='FIRST';setRunning(true);saveAndRender();toast('比賽開始，計時中！')}
function nextPhase(){if(s.phase==='FIRST'){setRunning(false);s.phase='HALF'}else if(s.phase==='HALF'){s.phase='SECOND';setRunning(true)}else if(s.phase==='SECOND'){setRunning(false);modal('⏱ 下半場結束',`<p class="modalText">選擇「進入延長賽」繼續計時，或先關閉視窗再按「結束比賽」。</p>`,[{label:'返回',fn:()=>{s.phase='SECOND';setRunning(true);saveAndRender();close()}},{label:'進入延長賽',primary:true,fn:()=>{s.phase='EXTRA';setRunning(true);saveAndRender();close()}}]);return}else if(s.phase==='EXTRA'){if(s.runningSince)setRunning(false);else setRunning(true)}saveAndRender()}
function finishMatch(){if(!confirm('確認結束本場比賽？結束後仍可修改事件紀錄。'))return;setRunning(false);s.phase='FINISHED';s.endAt=now();saveAndRender();toast('比賽已結束')}
function topScorers(){const map={};s.events.filter(e=>e.type==='GOAL'&&e.team==='OUR'&&e.number).forEach(e=>map[e.number]=(map[e.number]||0)+1);return Object.entries(map).sort((a,b)=>b[1]-a[1]||+a[0]-+b[0])}
function reportHTML(){const scorers=topScorers(),max=scorers[0]?.[1]||0,winners=scorers.filter(x=>x[1]===max);const win=s.scores.OUR>s.scores.OPP;
const mvp=max&&win?`<h3 class="summaryTitle">⚽ 單場 MVP｜${max} 球</h3><p class="modalText">${winners.length>1?'並列 '+max+' 球｜':''}${winners.map(x=>'#'+esc(x[0])).join('、')}</p>`:max?`<h3 class="summaryTitle">⚽ 本場最多進球${winners.length>1?'（並列 '+max+' 球）':''}</h3><p class="modalText">${winners.map(x=>'#'+esc(x[0])+'（'+x[1]+' 球）').join('、')}</p>`:'';
return `<div style="text-align:center"><div style="font-size:15px;font-weight:800">${esc(s.ourTeam||'我方')}　<span style="color:#facc15;font-size:28px">${s.scores.OUR} : ${s.scores.OPP}</span>　${esc(s.oppTeam||'對手')}</div><div class="small">${esc(s.matchName)} ${esc(s.stage)} ${esc(s.round)} ${esc(s.venue)}</div></div><div class="summaryRow"><span>比賽日期</span><b>${esc(when(s.startAt||now()).slice(0,10))}</b></div><div class="summaryRow"><span>狀態</span><b>${phaseName()}</b></div><div class="summaryRow"><span>時間紀錄</span><b>${fmt(elapsed())}｜規定 ${s.regulation} 分</b></div><div class="summaryRow"><span>開始／結束</span><b>${when(s.startAt)}／${when(s.endAt)}</b></div>${mvp}<h3 class="summaryTitle">球員進球統計</h3>${scorers.length?scorers.map(x=>`<div class="summaryScorer">⚽ #${esc(x[0])}｜${x[1]} 球</div>`).join(''):'<div class="empty">尚無球員進球資料</div>'}<h3 class="summaryTitle">本場精彩事件（${s.events.length} 筆）</h3><div class="log">${s.events.length?s.events.map(logHTML).join(''):'<div class="empty">尚無事件紀錄</div>'}</div>`}
function openSummary(){modal('⚽ 比賽摘要',reportHTML(),[{label:'關閉',fn:close},{label:'分享／儲存圖片',primary:true,fn:()=>{saveImage()}}])}
function sanitizeFilename(x){return (x||'足球比賽').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,35)}
function filename(ext){const d=new Date(s.startAt||now());const date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('');return `${date}_${sanitizeFilename(s.ourTeam)}_${s.scores.OUR}-${s.scores.OPP}_${sanitizeFilename(s.oppTeam)}.${ext}`}
function download(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const csvSafe=t=>{const v=String(t??'');return '"'+(/^[=+@\-\t\r]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"'};
function exportCSV(){const header=['match_id','match_date','match_name','stage','round','venue','our_team','opponent_team','regulation_minutes','actual_seconds','phase','our_score','opponent_score','time','seconds','event','team','player_number','assist_number','recorded_at'];const base=[s.matchId,when(s.startAt),s.matchName,s.stage,s.round,s.venue,s.ourTeam,s.oppTeam,s.regulation,elapsed(),s.phase,s.scores.OUR,s.scores.OPP];const rows=s.events.length?s.events.map(e=>[...base,fmt(e.second),e.second,e.type,e.team,e.number,e.assist,when(e.recordedAt)]):[[...base,'','','','','','','']];download(new Blob(['\ufeff'+[header,...rows].map(r=>r.map(csvSafe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),filename('csv'));toast('CSV 已匯出')}
function saveImage(){const width=1080,pad=64,dpr=1;const rowH=52;const scores=topScorers(),lines=s.events.map(e=>`${fmt(e.second)}　${teamLabels[e.team]} ${e.number?'#'+e.number+' ':''}${eventLabels[e.type]||e.type}${e.assist?' 助攻 #'+e.assist:''}`);const h=Math.max(920,740+(scores.length+lines.length)*rowH);const c=document.createElement('canvas');c.width=width*dpr;c.height=h*dpr;const g=c.getContext('2d');g.fillStyle='#122236';g.fillRect(0,0,width,h);g.fillStyle='#1b514b';g.fillRect(0,0,width,205);g.fillStyle='#dcebea';g.font='bold 43px sans-serif';g.fillText('⚽ 足球比賽摘要',pad,91);g.font='27px sans-serif';g.fillText(`v${VERSION}  •  ${when(s.startAt||now()).slice(0,10)}`,pad,146);
const cut=(t,max=22)=>Array.from(String(t||'')).slice(0,max).join('');g.fillStyle='#f5fbff';g.font='bold 38px sans-serif';g.fillText(cut(s.ourTeam||'我方',12),pad,277);g.textAlign='right';g.fillText(cut(s.oppTeam||'對手',12),width-pad,277);g.textAlign='center';g.fillStyle='#facc15';g.font='bold 75px sans-serif';g.fillText(`${s.scores.OUR} : ${s.scores.OPP}`,width/2,372);g.fillStyle='#c7d8e4';g.font='29px sans-serif';g.fillText(cut([s.matchName,s.stage,s.round].filter(Boolean).join('｜'),30),width/2,432);g.fillText('🏟 '+cut(s.venue||'未填場地',25),width/2,480);g.fillText(`${phaseName()}　|　${fmt(elapsed())}　|　規定 ${s.regulation} 分鐘`,width/2,529);g.textAlign='left';let y=603;const title=t=>{g.fillStyle='#facc15';g.font='bold 34px sans-serif';g.fillText(t,pad,y);y+=55};const line=t=>{g.fillStyle='#eef6ff';g.font='26px sans-serif';g.fillText(cut(t,44),pad+10,y);y+=rowH};if(scores.length){const max=scores[0][1],w=scores.filter(e=>e[1]===max);title(s.scores.OUR>s.scores.OPP?`⚽ 單場 MVP｜${max} 球`:`⚽ 本場最多進球｜${max} 球`);line(`${w.length>1?'並列：':''}${w.map(x=>'#'+x[0]).join('、')}`)}title('球員進球統計');scores.length?scores.forEach(x=>line(`#${x[0]}　${x[1]} 球`)):line('尚無球員進球紀錄');title('精彩事件');lines.length?lines.forEach(line):line('尚無事件紀錄');g.font='24px sans-serif';g.fillStyle='#97b8c8';g.fillText('足球場邊記錄器　•　' + when(now()),pad,h-44);
c.toBlob(async blob=>{if(!blob){toast('無法產生圖片');return}const f=new File([blob],filename('png'),{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'足球比賽摘要'});return}catch(e){if(e.name==='AbortError')return}}download(blob,filename('png'));toast('圖片已產生')},'image/png')}
function newMatch(){if(!confirm('確定建立新比賽？請先備份目前資料。本場將從暫存工作區清除。'))return;s=defaultData();saveAndRender();close();toast('已建立新比賽')}
function backup(){download(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),filename('json'));toast('已備份 JSON')}
function toolsModal(){modal('⚙️ 更多工具',`<h3 class="summaryTitle" style="margin-top:0">畫面密度</h3><p class="modalText">v6.52：賽事／場地名稱微幅放大，欄位高度不變。階段與場次維持較小字級。</p><div class="actions"><button data-layout="normal">一般</button><button data-layout="compact">Compact</button><button data-layout="ultra">Ultra Compact</button></div><h3 class="summaryTitle">資料管理</h3><div class="actions"><button id="backupBtn">備份 JSON</button><button id="restoreBtn">匯入 JSON</button></div><p class="small">資料儲存於目前瀏覽器本機。換手機、清除網站資料或無痕模式可能造成資料遺失，建議賽後匯出備份。</p><div class="alert">匯入或開始新比賽會替換目前工作區，請先備份。</div>`,[{label:'新比賽',fn:newMatch},{label:'關閉',primary:true,fn:close}]);$('backupBtn').onclick=backup;$('restoreBtn').onclick=()=>$('importInput').click();$('modalBody').querySelectorAll('[data-layout]').forEach(b=>{if(b.dataset.layout===s.layout)b.classList.add('btnMint');b.onclick=()=>{s.layout=b.dataset.layout;saveAndRender();toolsModal()}})}
$('importInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.events)||!data.scores||!data.phase)throw Error('格式不符合');if(!confirm('確定匯入備份並覆蓋目前工作區？'))return;s={...defaultData(),...data};s.events=s.events.filter(x=>x&&Object.hasOwn(eventLabels,x.type));if(!s.scores||typeof s.scores.OUR!=='number')throw Error('比分資料錯誤');saveAndRender();close();toast('備份匯入成功')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
$('metaEditBtn').onclick=openMeta;$('rosterBtn').onclick=openRoster;$('startBtn').onclick=startMatch;$('phaseBtn').onclick=nextPhase;$('endBtn').onclick=finishMatch;$('manualScoreBtn').onclick=openScore;$('fullLogBtn').onclick=openLog;$('summaryBtn').onclick=openSummary;$('imageBtn').onclick=saveImage;$('csvBtn').onclick=exportCSV;$('toolsBtn').onclick=toolsModal;
$('eventsCard').addEventListener('click',e=>{const b=e.target.closest('[data-event]');if(b)eventForm(b.dataset.event)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;const rec=s.events.find(x=>x.id===b.dataset.edit);if(rec)eventForm(rec.type,rec)});
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();else render()});load();if(!s.manualOffsets){s.manualOffsets={OUR:0,OPP:0};}render();setInterval(()=>{if(s.runningSince)$('clock').textContent=fmt(elapsed())},500);
})();
</script></body></html>
